name: NexusVideo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============ 1. Python 后端验证 ============
  python-lint:
    name: Python 语法与依赖检查
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 验证 Python 语法（ast.parse）
        run: |
          python -c "
          import ast, sys, pathlib
          errors = []
          for py in sorted(pathlib.Path('backend').rglob('*.py')):
              try:
                  ast.parse(py.read_text())
                  print(f'  ✅ {py}')
              except SyntaxError as e:
                  errors.append(f'  ❌ {py}: {e}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print(f'\n全部 {len(list(pathlib.Path(\"backend\").rglob(\"*.py\")))} 个文件通过')
          "

      - name: 验证 JSON 工作流模板
        run: |
          python -c "
          import json, pathlib, sys
          errors = []
          for wf in sorted(pathlib.Path('workflows').rglob('*.json')):
              try:
                  data = json.loads(wf.read_text())
                  # ComfyUI native format: keys are node IDs (not a 'nodes' array)
                  nodes = {k: v for k, v in data.items() if isinstance(v, dict)}
                  print(f'  ✅ {wf.name}: {len(nodes)} nodes')
              except json.JSONDecodeError as e:
                  errors.append(f'  ❌ {wf}: {e}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('\n全部工作流 JSON 验证通过')
          "

      - name: 验证 FastAPI 路由导入
        run: |
          set +e
          python -c "
          import sys, pathlib, importlib, traceback, os
          sys.path.insert(0, str(pathlib.Path('backend').resolve()))
          for pkg in ['websockets', 'bcrypt', 'httpx', 'fastapi', 'pydantic']:
              try:
                  mod = importlib.import_module(pkg)
                  print(f'  [dep] {pkg}=={getattr(mod, \"__version__\", \"unknown\")}')
              except ImportError as e:
                  print(f'  [dep] {pkg}: NOT INSTALLED - {e}')
          modules = [
              'core.auth', 'core.comfyui_client', 'core.comfyui_ws',
              'core.inference_router', 'core.progress_translator',
              'core.task_manager', 'core.user_db', 'core.workflow_translator',
              'routers.auth', 'routers.cloud_forward', 'routers.generate',
              'routers.progress', 'routers.system', 'routers.task', 'routers.upload',
              'config', 'exceptions', 'local_server'
          ]
          failed = []
          for m in modules:
              try:
                  importlib.import_module(m)
                  print(f'  ✅ {m}')
              except Exception as e:
                  print(f'  ❌ {m}: {type(e).__name__}: {e}')
                  traceback.print_exc()
                  failed.append((m, type(e).__name__, str(e)))
          if failed:
              print(f'\\n{len(failed)}/{len(modules)} 个模块导入失败')
              sys.exit(1)
          print(f'\\n全部 {len(modules)} 个模块导入成功')
          " 2>&1 | tee python-import.log
          PY_EXIT=${PIPESTATUS[0]}
          set -e
          if [ $PY_EXIT -ne 0 ]; then
            {
              echo "## Python import FAILED (exit=$PY_EXIT)"
              echo '```'
              cat python-import.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit $PY_EXIT
          fi

  # ============ 2. Rust / Tauri 编译验证 ============
  rust-lint:
    name: Rust 编译验证
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('client/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential

      - name: 编译 Rust 代码（不含 Tauri 打包）
        run: |
          cd client/src-tauri
          echo "=== Rust 环境信息 ==="
          rustc --version
          cargo --version
          echo ""
          echo "=== Cargo.toml 内容 ==="
          cat Cargo.toml
          echo ""
          echo "=== 开始 cargo check ==="
          set +e
          RUST_BACKTRACE=1 cargo check --workspace 2>&1 | tee cargo-check.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          echo ""
          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            echo "=== cargo check 失败（exit code=$EXIT_CODE）==="
            echo ""
            echo "=== 错误详情 ==="
            grep -E "^error|^  -->|^  |error\[" cargo-check.log || true
            echo ""
            echo "=== 最后 80 行 ==="
            tail -80 cargo-check.log
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Rust cargo check FAILED (exit=$EXIT_CODE)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "^error|^  -->|^  |error\[" cargo-check.log >> "$GITHUB_STEP_SUMMARY" || true
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo "=== LAST 80 LINES ===" >> "$GITHUB_STEP_SUMMARY"
            tail -80 cargo-check.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit $EXIT_CODE
          fi
        timeout-minutes: 15

      - name: 上传 cargo 日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-check-log
          path: client/src-tauri/cargo-check.log
          if-no-files-found: ignore

  # ============ 3. TypeScript / Vue 检查 ============
  frontend-check:
    name: TypeScript 类型检查
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "client/package-lock.json"

      - name: Install frontend dependencies
        run: |
          cd client
          npm ci
        timeout-minutes: 10

      - name: TypeScript 类型检查
        run: |
          cd client
          npx vue-tsc --noEmit
        timeout-minutes: 5

  # ============ 4. 集成测试 ============
  integration-test:
    name: 端到端集成测试
    runs-on: ubuntu-22.04
    needs: [python-lint, rust-lint, frontend-check]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: 运行集成测试
        run: python integration_test.py
        timeout-minutes: 10

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: integration_test.py

  # ============ 5. 工作流 JSON 校验 ============
  workflow-validation:
    name: ComfyUI 工作流结构校验
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 校验工作流节点结构
        run: |
          python3 << 'PYEOF'
          import json, pathlib, sys

          expected_classes = {
              "txt2video": ["WanVideoWrapper", "KSampler", "UNETLoader",
                            "CLIPLoader", "VAELoader", "CLIPTextEncode"],
              "img2video": ["AnimateDiffModelLoader", "AnimateDiffSampler",
                            "ControlNetLoader", "ControlNetApplyAdvanced",
                            "VAELoader", "CheckpointLoaderSimple"],
              "video2video": ["ADE_AnimateDiffCombine", "ADE_EmptyFrameLatentVideo",
                              "AnimateDiffModelLoader", "ControlNetLoader",
                              "Preprocessor", "VHS_LoadVideo"]
          }

          errors = []
          for wf_path in sorted(pathlib.Path("workflows").rglob("*.json")):
              data = json.loads(wf_path.read_text())
              # ComfyUI native format: keys are node IDs, values are node objects
              nodes = {k: v for k, v in data.items() if isinstance(v, dict)}
              node_classes = {n.get("class_type", "") for n in nodes.values()}
              wf_name = wf_path.stem

              if wf_name in expected_classes:
                  for exp in expected_classes[wf_name]:
                      if not any(exp in c for c in node_classes):
                          errors.append(f"  ❌ {wf_name}: 缺少节点 {exp}")

              print(f"  ✅ {wf_name}: {len(nodes)} 节点, 类: {', '.join(sorted(node_classes)[:5])}...")

          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print("\n全部工作流节点结构校验通过")
          PYEOF

  # ============ 汇总 ============
  summary:
    name: 📋 CI 汇总
    runs-on: ubuntu-22.04
    needs: [python-lint, rust-lint, frontend-check, integration-test, workflow-validation]
    if: always()
    steps:
      - name: 汇总报告
        run: |
          echo "======================================"
          echo " NexusVideo CI Pipeline 汇总"
          echo "======================================"
          echo ""
          echo " ✅ Python 后端验证: ${{ needs.python-lint.result }}"
          echo " ✅ Rust 编译验证: ${{ needs.rust-lint.result }}"
          echo " ✅ TypeScript 检查: ${{ needs.frontend-check.result }}"
          echo " ✅ 端到端集成测试: ${{ needs.integration-test.result }}"
          echo " ✅ 工作流结构校验: ${{ needs.workflow-validation.result }}"
          echo ""
          if [ "${{ needs.python-lint.result }}" == "success" ] && \
             [ "${{ needs.rust-lint.result }}" == "success" ] && \
             [ "${{ needs.frontend-check.result }}" == "success" ] && \
             [ "${{ needs.integration-test.result }}" == "success" ] && \
             [ "${{ needs.workflow-validation.result }}" == "success" ]; then
            echo "🎉 全部 CI 检查通过！"
          else
            echo "⚠️  部分检查失败，请查看上方日志"
            exit 1
          fi