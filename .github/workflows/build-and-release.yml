name: NexusVideo Build & Release

# 触发条件：
#   1. push 到 main 分支 → 执行 CI 检查 + 构建测试包
#   2. 手动触发 (workflow_dispatch) → 可指定版本号
#   3. 创建 Git tag (v*) → 执行完整打包 + 签名 + GitHub Release
on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (如 0.1.0, 留空自动从 tauri.conf.json 读取)"
        required: false
        type: string
      sign_windows:
        description: "Windows 签名"
        required: false
        default: false
        type: boolean
      sign_macos:
        description: "macOS 签名 + 公证"
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 构建产物前缀（版本号从 tag 或 tauri.conf.json 自动获取）
  APP_NAME: NexusVideo

permissions:
  contents: write
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ================================================================
  # 1. 前置检查 (所有 ref 共享)
  # ================================================================
  preflight:
    name: 前置检查
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 确定版本号
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(python3 -c "import json; print(json.load(open('client/src-tauri/tauri.conf.json'))['version'])")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "版本号: $VERSION"

      - name: 验证版本号一致性
        shell: bash
        run: |
          TAUARI_VER=$(python3 -c "import json; print(json.load(open('client/src-tauri/tauri.conf.json'))['version'])")
          PKG_VER=$(python3 -c "import json; print(json.load(open('client/package.json'))['version'])")
          CARGO_VER=$(grep '^version' client/src-tauri/Cargo.toml | head -1 | cut -d'"' -f2)
          echo "tauri.conf.json: $TAUARI_VER"
          echo "package.json:    $PKG_VER"
          echo "Cargo.toml:      $CARGO_VER"
          if [[ "$TAUARI_VER" != "$PKG_VER" || "$TAUARI_VER" != "$CARGO_VER" ]]; then
            echo "::error::版本号不一致! 请同步更新 tauri.conf.json / package.json / Cargo.toml"
            exit 1
          fi

  # ================================================================
  # 1.5 Rust 编译检查 (push 到 main 时验证 5 处 P0 修复可编译)
  # ================================================================
  rust-check:
    name: Rust 编译检查 (cargo check)
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust stable（windows-latest 自带 MSVC 链接器）
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: 缓存 cargo 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            client/src-tauri/target
          key: cargo-check-${{ hashFiles('client/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-check-

      - name: 创建后端资源占位目录（让 Tauri build script 不报错）
        # Tauri v2 的 build script 会检查 bundle.resources 配置的路径存在性，
        # rust-check job 只做编译检查不打包，只需占位即可。
        run: |
          mkdir -p resources/python_env
          mkdir -p resources/backend
          touch resources/python_env/.gitkeep resources/backend/.gitkeep

      - name: cargo check（验证 5 处 P0 修复可编译通过）
        shell: bash
        run: cargo check --manifest-path client/src-tauri/Cargo.toml --offline
        timeout-minutes: 25

  # ================================================================
  # 2. 前端构建 (所有 ref 共享)
  # ================================================================
  frontend-build:
    name: 前端构建
    runs-on: ubuntu-22.04
    needs: [preflight]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "client/package-lock.json"

      - name: 安装依赖
        run: cd client && npm ci
        timeout-minutes: 10

      - name: 类型检查
        run: cd client && npx vue-tsc --noEmit
        timeout-minutes: 5

      - name: 构建
        run: cd client && npm run build
        timeout-minutes: 10

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: client/dist/
          if-no-files-found: error

  # ================================================================
  # 3. Windows 打包 (tag 触发 + 手动触发)
  # ================================================================
  build-windows:
    name: Windows 打包 (.exe)
    runs-on: windows-latest
    needs: [preflight, frontend-build]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整克隆，确保 tag 指向正确 commit（浅克隆可能导致 checkout 错误 commit）

      - name: 安装 Rust stable
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "client/package-lock.json"

      - name: 安装系统依赖
        run: |
          # WebView2 Runtime (Tauri v2 需要)
          # Windows-latest runner 通常已预装，此处仅确认
          if (Test-Path "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe") {
            Write-Host "Edge/WebView2 已安装"
          }

      - name: 安装前端
        run: cd client && npm ci
        timeout-minutes: 10

      - name: 构建前端
        run: cd client && npm run build
        timeout-minutes: 10

      - name: 安装 Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "^2.0"

      - name: 安装 Python（构建后端 venv 用）
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 构建后端 Python 环境 (venv + backend)
        # 调用程流深提供的脚本：scripts/build_backend_bundle.ps1
        # 它把 venv 建在 <repo>/resources/python_env、backend 拷到 <repo>/resources/backend，
        # 与 tauri.conf.json 的 bundle.resources（"../../resources/..."，相对 src-tauri）对应，
        # 打包后落在 <exe_dir>/resources/ 下，满足 paths.rs 的 resource() 期望。
        # 脚本靠 $PSScriptRoot 自解析路径，不受当前 cwd 影响。
        shell: pwsh
        run: |
          pwsh scripts/build_backend_bundle.ps1

      - name: 构建 Tauri (Windows)
        shell: bash
        run: |
          echo "[INFO] 当前 commit: $(git rev-parse HEAD)"
          echo "[INFO] 当前 tag/ref: $(git describe --tags --always 2>/dev/null || echo 'no-tag')"
          echo "[INFO] tauri.conf.json version:"
          python3 -c "import json; print('  ', json.load(open('client/src-tauri/tauri.conf.json'))['version'])"
          echo "[INFO] 验证 resources 目录存在性:"
          ls -la resources/python_env/ 2>&1 || echo "::error::resources/python_env 不存在"
          ls -la resources/backend/local_server.py 2>&1 || echo "::error::resources/backend/local_server.py 不存在"
          echo "[INFO] 检查 resources/python_env/python.exe (Windows):"
          test -f resources/python_env/Scripts/python.exe && echo "  python.exe OK" || echo "::error::python.exe 不存在"

          # 强制清理：确保不使用任何缓存的编译产物
          cd client/src-tauri
          echo "[INFO] 工作目录: $(pwd)"
          echo "[INFO] 从 src-tauri 检查 resources 路径: ../../resources/python_env"
          test -d ../../resources/python_env && echo "  ../../resources/python_env OK" || echo "::error::../../resources/python_env 不存在"

          cargo clean 2>&1 | tail -3
          echo "[INFO] 开始全新构建..."
          cargo tauri build 2>&1
        timeout-minutes: 25

      - name: 签名 (Windows EV)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.sign_windows == 'true' }}
        env:
          NEXUS_SIGN_CERT_PATH: ${{ secrets.NEXUS_SIGN_CERT_PATH }}
          NEXUS_SIGN_PASSWORD: ${{ secrets.NEXUS_SIGN_PASSWORD }}
        shell: powershell
        run: |
          if (-not $env:NEXUS_SIGN_CERT_PATH -or -not $env:NEXUS_SIGN_PASSWORD) {
            Write-Host "[SKIP] 签名凭据未配置，跳过签名" -ForegroundColor Yellow
            exit 0
          }

          $CERT_PATH = "${{ secrets.NEXUS_SIGN_CERT_PATH }}"
          $EXE_PATTERN = "target/release/bundle/nsis/NexusVideo_${{ needs.preflight.outputs.version }}_x64-setup.exe"

          if (Test-Path $EXE_PATTERN) {
            $securePwd = ConvertTo-SecureString $env:NEXUS_SIGN_PASSWORD -AsPlainText -Force
            signtool sign /fd SHA256 /f $CERT_PATH /p $securePwd `
              /tr http://timestamp.digicert.com /td SHA256 `
              $EXE_PATTERN
            signtool verify /pa /v $EXE_PATTERN
            Write-Host "[OK] Windows 签名完成" -ForegroundColor Green
          } else {
            Write-Host "[WARN] 找不到 .exe 文件: $EXE_PATTERN" -ForegroundColor Yellow
          }

      - name: 生成 SHA256
        shell: bash
        run: |
          EXE_PATH="client/src-tauri/target/release/bundle/nsis/NexusVideo_${{ needs.preflight.outputs.version }}_x64-setup.exe"
          if [ -f "$EXE_PATH" ]; then
            sha256sum "$EXE_PATH" > "$EXE_PATH.sha256"
            echo "SHA256: $(cat "$EXE_PATH.sha256")"
          fi

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: nexusvideo-windows-${{ needs.preflight.outputs.version }}
          path: client/src-tauri/target/release/bundle/nsis/NexusVideo_${{ needs.preflight.outputs.version }}_x64*
          if-no-files-found: error

  # ================================================================
  # 4. macOS 打包 (tag 触发 + 手动触发)
  # ================================================================
  build-macos:
    name: macOS 打包 (.dmg)
    runs-on: macos-14
    needs: [preflight, frontend-build]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    timeout-minutes: 40
    strategy:
      matrix:
        arch: [x64, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整克隆，确保 tag 指向正确 commit

      - name: 安装 Rust stable
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "client/package-lock.json"

      - name: 安装 Xcode Command Line Tools
        run: xcode-select --install || true

      - name: 安装 Python（构建后端 venv 用）
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements-pack.txt"

      - name: 安装前端
        run: cd client && npm ci
        timeout-minutes: 10

      - name: 构建前端
        run: cd client && npm run build
        timeout-minutes: 10

      - name: 安装 Tauri CLI
        run: cargo install tauri-cli --version "^2.0"

      - name: 构建后端 Python 环境 (venv + backend)
        # macOS 同样要把 python_env / backend 打进包。产物位置：<repo>/resources/。
        shell: bash
        run: |
          echo "==========================================="
          echo " macOS 后端打包环境构建"
          echo "==========================================="
          echo "[0/5] 诊断信息"
          echo "  pwd: $(pwd)"
          echo "  python3 路径: $(which python3)"
          echo "  python3 版本: $(python3 --version 2>&1)"
          echo "  venv 模块测试: $(python3 -c 'import venv; print(\"venv OK\")' 2>&1)"
          echo "  requirements-pack.txt 存在: $(test -f backend/requirements-pack.txt && echo YES || echo NO)"
          echo "  requirements 内容:"
          cat backend/requirements-pack.txt

          echo ""
          echo "[1/5] 创建 venv"
          rm -rf resources/python_env
          if python3 -c 'import venv' 2>/dev/null; then
            echo "  [尝试] python3 -m venv"
            python3 -m venv resources/python_env 2>&1
            if [ $? -ne 0 ]; then
              echo "  [WARN] venv 失败，尝试 virtualenv..."
              python3 -m pip install --user virtualenv 2>&1
              python3 -m virtualenv resources/python_env 2>&1
            fi
          else
            echo "  [WARN] 无 venv 模块，安装 virtualenv"
            python3 -m pip install --user virtualenv 2>&1
            python3 -m virtualenv resources/python_env 2>&1
          fi
          if [ ! -f resources/python_env/bin/python3 ]; then
            echo "::error::venv 创建失败，找不到 bin/python3"
            ls -la resources/python_env/ 2>&1 || true
            exit 1
          fi
          echo "  [OK] venv 创建成功"

          echo ""
          echo "[2/5] 升级 pip + 安装依赖（带重试）"
          source resources/python_env/bin/activate
          echo "  [debug] 激活后 python: $(which python)"
          echo "  [debug] 激活后 pip: $(which pip)"
          pip install --upgrade pip setuptools wheel 2>&1 | tail -3
          echo "  [debug] pip 版本: $(pip --version)"

          max_retries=2
          for i in $(seq 1 $max_retries); do
            echo "  [attempt $i/$max_retries] pip install -r backend/requirements-pack.txt --timeout 120"
            pip install -r backend/requirements-pack.txt --timeout 120 2>&1 | tail -10
            if [ $? -eq 0 ]; then
              echo "  [OK] 安装成功"
              break
            fi
            echo "  [WARN] 安装失败，重试..."
          done
          if ! pip list 2>/dev/null | grep -q fastapi; then
            echo "::error::pip install 失败（已重试 $max_retries 次），fastapi 未安装"
            pip install fastapi --timeout 120 2>&1 | tail -5
            exit 1
          fi

          echo ""
          echo "[3/5] 验证关键依赖可导入"
          for mod in fastapi uvicorn pydantic bcrypt httpx; do
            if python3 -c "import $mod" 2>&1; then
              echo "  [OK] $mod"
            else
              echo "::error::$mod 导入失败"
              exit 1
            fi
          done
          echo "  [OK] fastapi 版本: $(python3 -c 'import fastapi; print(fastapi.__version__)')"

          echo ""
          echo "[4/5] 拷贝后端源码"
          rm -rf resources/backend
          cp -R backend resources/backend
          if [ ! -f resources/backend/local_server.py ]; then
            echo "::error::拷贝后缺少 local_server.py"
            exit 1
          fi
          echo "  [OK] 拷贝完成，文件数: $(find resources/backend -type f | wc -l)"

          echo ""
          echo "[5/5] 最终验证"
          echo "  resources/python_env/bin/python3: $(test -f resources/python_env/bin/python3 && echo OK || echo MISSING)"
          echo "  resources/backend/local_server.py: $(test -f resources/backend/local_server.py && echo OK || echo MISSING)"
          echo "==========================================="
          echo " macOS 后端打包环境构建完成"
          echo "==========================================="

      - name: 设置架构目标
        id: arch_target
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" == "aarch64" ]; then
            echo "cargo_target=aarch64-apple-darwin" >> "$GITHUB_OUTPUT"
            echo "dmg_suffix=aarch64" >> "$GITHUB_OUTPUT"
          else
            echo "cargo_target=x86_64-apple-darwin" >> "$GITHUB_OUTPUT"
            echo "dmg_suffix=x64" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建 Tauri (macOS ${{ matrix.arch }})
        shell: bash
        run: |
          cd client/src-tauri
          cargo clean 2>&1 | tail -2
          rustup target add ${{ steps.arch_target.outputs.cargo_target }}
          cargo tauri build --target ${{ steps.arch_target.outputs.cargo_target }}
        timeout-minutes: 30

      - name: 签名 + 公证 (macOS Developer ID)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event.inputs.sign_macos == 'true' }}
        env:
          NEXUS_TEAM_ID: ${{ secrets.NEXUS_TEAM_ID }}
          NEXUS_APPLE_ID: ${{ secrets.NEXUS_APPLE_ID }}
          NEXUS_APP_PASSWORD: ${{ secrets.NEXUS_APP_PASSWORD }}
          NEXUS_SIGN_IDENTITY: ${{ secrets.NEXUS_SIGN_IDENTITY }}
        shell: bash
        run: |
          if [ -z "$NEXUS_TEAM_ID" ] || [ -z "$NEXUS_APPLE_ID" ] || [ -z "$NEXUS_APP_PASSWORD" ]; then
            echo "[SKIP] macOS 签名凭据未配置，跳过签名 + 公证"
            exit 0
          fi

          DMG_PATTERN="target/${{ steps.arch_target.outputs.cargo_target }}/release/bundle/dmg/NexusVideo_${{ needs.preflight.outputs.version }}_${{ steps.arch_target.outputs.dmg_suffix }}.dmg"
          APP_PATH="target/${{ steps.arch_target.outputs.cargo_target }}/release/bundle/NexusVideo.app"

          if [ ! -f "$DMG_PATTERN" ] && [ ! -f "target/release/bundle/dmg/NexusVideo_${{ needs.preflight.outputs.version }}_${{ steps.arch_target.outputs.dmg_suffix }}.dmg" ]; then
            echo "[WARN] 找不到 DMG 文件，尝试查找..."
            find target -name "*.dmg" -type f || true
            exit 0
          fi

          # 定位实际 DMG 路径
          DMG_FILE=$(find target -name "*.dmg" -type f | head -1)
          if [ -z "$DMG_FILE" ]; then
            echo "[WARN] 未找到 DMG 文件，跳过签名"
            exit 0
          fi

          # 存储 App-Specific Password
          xcrun notarytool store-password "$NEXUS_APP_PASSWORD" \
            --apple-id "$NEXUS_APPLE_ID" \
            --label "NEXUS_APP_PASSWORD"

          # 签名 .app（先找 app 包）
          APP_FILE=$(dirname "$DMG_FILE")/NexusVideo.app
          if [ -d "$APP_FILE" ]; then
            codesign --deep --force --verify --verbose=2 \
              --sign "$NEXUS_SIGN_IDENTITY" \
              --options runtime \
              "$APP_FILE"
            echo "[OK] .app 签名完成"
          fi

          # 签名 DMG
          codesign --force --sign "$NEXUS_SIGN_IDENTITY" "$DMG_FILE"
          echo "[OK] DMG 签名完成"

          # 公证
          xcrun notarytool submit "$DMG_FILE" \
            --apple-id "$NEXUS_APPLE_ID" \
            --password "@keychain:NEXUS_APP_PASSWORD" \
            --team-id "$NEXUS_TEAM_ID" \
            --wait
          echo "[OK] Notarization 完成"

          # Stapling
          if [ -d "$APP_FILE" ]; then
            xcrun stapler staple "$APP_FILE"
          fi
          echo "[OK] Stapling 完成"

      - name: 生成 SHA256
        shell: bash
        run: |
          DMG_FILE=$(find client/src-tauri/target -name "*.dmg" -type f | head -1)
          if [ -n "$DMG_FILE" ]; then
            shasum -a 256 "$DMG_FILE" > "$DMG_FILE.sha256"
            echo "SHA256: $(cat "$DMG_FILE.sha256")"
          fi

      - name: 上传 macOS 产物
        uses: actions/upload-artifact@v4
        with:
          name: nexusvideo-macos-${{ matrix.arch }}-${{ needs.preflight.outputs.version }}
          path: client/src-tauri/target/**/NexusVideo_${{ needs.preflight.outputs.version }}_${{ steps.arch_target.outputs.dmg_suffix }}*
          if-no-files-found: warn

  # ================================================================
  # 5. 生成 Tauri Update Manifest
  # ================================================================
  generate-manifest:
    name: 生成 Update Manifest
    runs-on: ubuntu-22.04
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: 生成 update.json
        shell: bash
        run: |
          VERSION="${{ needs.preflight.outputs.version }}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # 计算 SHA256
          WIN_SHA=$(find artifacts/ -name "*.exe.sha256" -exec cat {} \; | awk '{print $1}')
          MAC_X64_SHA=$(find artifacts/ -name "*x64*.dmg.sha256" -exec cat {} \; | awk '{print $1}')
          MAC_ARM_SHA=$(find artifacts/ -name "*aarch64*.dmg.sha256" -exec cat {} \; | awk '{print $1}')

          cat > update.json << EOF
          {
            "version": "$VERSION",
            "date": "$DATE",
            "pub_date": "$DATE",
            "platforms": {
              "windows-x86_64": {
                "url": "https://releases.nexusvideo.com/NexusVideo_${VERSION}_x64-setup.exe",
                "sha256": "$WIN_SHA"
              },
              "darwin-x86_64": {
                "url": "https://releases.nexusvideo.com/NexusVideo_${VERSION}_x64.dmg",
                "sha256": "$MAC_X64_SHA"
              },
              "darwin-aarch64": {
                "url": "https://releases.nexusvideo.com/NexusVideo_${VERSION}_aarch64.dmg",
                "sha256": "$MAC_ARM_SHA"
              }
            },
            "body": "请查看 [GitHub Release Notes](https://github.com/${{ github.repository }}/releases/tag/v${VERSION})"
          }
          EOF

          echo "=== update.json ==="
          cat update.json

      - name: 上传 Update Manifest
        uses: actions/upload-artifact@v4
        with:
          name: update-manifest
          path: update.json
          if-no-files-found: error

  # ================================================================
  # 6. GitHub Release (仅 tag 触发)
  # ================================================================
  github-release:
    name: 创建 GitHub Release
    runs-on: ubuntu-22.04
    needs: [build-windows, build-macos, generate-manifest]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        shell: bash
        run: |
          # VERSION fallback：若 preflight 输出为空（异常情况），从 tauri.conf.json 直接读取
          if [[ -z "$VERSION" ]]; then
            echo "[WARN] preflight.outputs.version 为空，从 tauri.conf.json 读取版本号"
            VERSION=$(python3 -c "import json; print(json.load(open('client/src-tauri/tauri.conf.json'))['version'])")
          fi
          echo "[INFO] Release 版本号: v${VERSION}"
          # 使用 $'...' 让 \n 被正确解释为换行（双引号里 \n 是字面文本）
          RELEASE_NOTES=$'## NexusVideo v'"${VERSION}"$'\n\n发布日期: '"$(date -u +%Y-%m-%d)"$'\n\n### 下载\n\n- Windows: NexusVideo_'"${VERSION}"$'_x64-setup.exe\n- macOS Intel: NexusVideo_'"${VERSION}"$'_x64.dmg\n- macOS ARM: NexusVideo_'"${VERSION}"$'_aarch64.dmg\n\n### 更新说明\n\n详见 [Release Notes](https://github.com/'"${{ github.repository}}"$'/releases/tag/v'"${VERSION}"$')'

          # 幂等处理：若同 tag 的 Release 已存在（如重跑遗留），先删除再重建，避免 "release already exists"
          if gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "[INFO] 已存在 v${VERSION} Release，先删除以保证重跑幂等"
            gh release delete "v${VERSION}" --yes --repo "${{ github.repository }}"
          fi

          # 只上传打包产物（.exe/.dmg/.sha256/update.json），排除 frontend-dist 等无关 artifact
          RELEASE_FILES=$(find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.sha256' -o -name 'update.json' \))
          echo "=== 将上传以下文件 ==="
          echo "$RELEASE_FILES"

          gh release create "v${VERSION}" \
            --title "NexusVideo v${VERSION}" \
            --notes "$RELEASE_NOTES" \
            $RELEASE_FILES

          echo "[OK] GitHub Release 已创建: v${VERSION}"

  # ================================================================
  # 7. 汇总 (CI only, 非 tag 触发时)
  # ================================================================
  ci-summary:
    name: 📋 CI 汇总
    runs-on: ubuntu-22.04
    needs: [preflight, frontend-build, rust-check, build-windows, build-macos]
    if: always() && !startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: 汇总报告
        run: |
          echo "======================================"
          echo " NexusVideo Build & Release 汇总"
          echo "======================================"
          echo " Version: ${{ needs.preflight.outputs.version }}"
          echo " Branch:  ${{ github.ref_name }}"
          echo ""
          echo " ✅ 前置检查:    ${{ needs.preflight.result }}"
          echo " ✅ Rust 编译检查: ${{ needs.rust-check.result }}"
          echo " ✅ 前端构建:    ${{ needs.frontend-build.result }}"
          echo " ✅ Windows 打包: ${{ needs.build-windows.result }}"
          echo " ✅ macOS 打包:   ${{ needs.build-macos.result }}"
          echo ""
          echo "产物已上传到 Artifacts 页面"