# =============================================================================
# NexusVideo Tauri 自动更新服务器 Nginx 配置
# 版本：1.0.0
# 作者：NexusVideo MVP 团队 · 运维架构师 唐磐石
#
# 用途：为 Tauri Updater 提供静态文件服务
# 关键设计：
#   1. update.json 不缓存（客户端每次都能获取最新版本信息）
#   2. 安装包长期缓存（减少带宽成本）
#   3. 启用 Gzip 压缩（update.json 通常是几 KB）
#   4. 启用 HSTS + OCSP Stapling（HTTPS 安全加固）
#   5. 速率限制防止恶意爬取
# =============================================================================

# ---- 全局限速区（防爬虫/防 DDOS）----
limit_req_zone $binary_remote_addr zone=update_limit:10m rate=10r/s;

# ---- HTTP → HTTPS 强制跳转 ----
server {
    listen 80;
    server_name update.nexusvideo.com;
    return 301 https://$host$request_uri;
}

# ---- HTTPS 主配置 ----
server {
    listen 443 ssl http2;
    server_name update.nexusvideo.com;

    # ---- SSL 证书 ----
    # 使用 Let's Encrypt（推荐）或自有证书
    ssl_certificate     /etc/letsencrypt/live/update.nexusvideo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/update.nexusvideo.com/privkey.pem;

    # ---- SSL 安全配置 ----
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP Stapling（加速 TLS 握手）
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # HSTS（严格传输安全，1 年）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ---- 文档根目录 ----
    root /var/www/nexusvideo-update;
    index update.json;

    # ---- 安全头 ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'" always;

    # ---- Gzip 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types application/json application/javascript text/plain text/css application/octet-stream;
    gzip_min_length 1024;

    # ---- 速率限制 ----
    limit_req zone=update_limit burst=20 nodelay;

    # =====================================================================
    # 关键路由：update.json（不缓存，每次获取最新版本）
    # =====================================================================
    location = /update.json {
        # 关键：强制客户端和服务端都不缓存
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        # 内容类型
        default_type application/json;
        add_header Content-Type "application/json; charset=utf-8" always;

        # 允许跨域（Tauri 桌面端通常不需要，但以防万一）
        add_header Access-Control-Allow-Origin "*" always;

        try_files $uri =404;
    }

    # =====================================================================
    # 安装包路由（长期缓存，节省带宽）
    # =====================================================================
    location /releases/ {
        # 关键：安装包哈希写入文件名/URL，可安全长缓存
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Expires "Thu, 31 Dec 2037 23:55:55 GMT" always;

        # 内容类型根据扩展名自动识别
        # .exe, .AppImage, .dmg 都是 application/octet-stream
        add_header Content-Type "application/octet-stream" always;

        # 支持断点续传（大文件下载友好）
        add_header Accept-Ranges "bytes" always;

        # 隐藏 Nginx 版本
        proxy_hide_header X-Powered-By;

        try_files $uri =404;
    }

    # =====================================================================
    # 旧版本 update.json 兼容路由
    # 如果客户端请求 /releases/X.Y.Z/update.json，重定向到根 update.json
    # =====================================================================
    location ~ ^/releases/[^/]+/update\.json$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        return 301 /update.json;
    }

    # =====================================================================
    # 健康检查端点（给监控系统使用）
    # =====================================================================
    location = /health {
        access_log off;
        return 200 '{"status":"ok","service":"nexusvideo-update-server","version":"1.0.0"}';
        add_header Content-Type "application/json" always;
    }

    # =====================================================================
    # 404 页面
    # =====================================================================
    location = /404.html {
        internal;
        return 404 '{"error":"not_found","message":"请求的资源不存在"}';
        add_header Content-Type "application/json" always;
    }

    error_page 404 /404.html;

    # ---- 日志 ----
    access_log /var/log/nginx/nexusvideo-update-access.log combined buffer=16k flush=5s;
    error_log  /var/log/nginx/nexusvideo-update-error.log warn;
}