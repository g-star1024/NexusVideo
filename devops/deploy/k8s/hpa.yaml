# ============================================================
# NexusVideo HPA — 水平自动伸缩
#
# 架构位置：弹性伸缩层 — 基于 Prometheus 自定义指标自动扩缩
#
# 伸缩策略：
#   扩容条件：Redis 队列深度 > 5 或 GPU 利用率 > 75%（持续 2 分钟）
#   缩容条件：队列深度 < 1 且 GPU 利用率 < 30%（持续 5 分钟）
#   最小 1 台（基线），最大 10 台（弹性上限）
#
# 注意：需要安装 metrics-server 和 prometheus-adapter
# 阿里云 ACK 默认已安装 metrics-server
# ============================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: comfyui-worker-hpa
  namespace: nexusvideo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: comfyui-worker
  minReplicas: 1
  maxReplicas: 10
  # 冷却时间
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100  # 每次最多增加 100%（即翻倍）
          periodSeconds: 60
        - type: Pods
          value: 3  # 每次最多增加 3 个 Pod
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300  # 缩容观察窗口 5 分钟
      policies:
        - type: Pods
          value: 1  # 每次最多减少 1 个 Pod
          periodSeconds: 60
  metrics:
    # 基于 CPU 利用率（兜底）
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    # 基于自定义 Prometheus 指标（推荐）
    # 队列深度：当队列 > 5 时触发扩容
    - type: Pods
      pods:
        metric:
          name: nexusvideo_queue_depth
        target:
          type: AverageValue
          averageValue: "5"
    # GPU 利用率：当 GPU > 75% 时触发扩容
    # （需要 NVIDIA DCGM exporter 采集指标）
    - type: Pods
      pods:
        metric:
          name: nvidia_gpu_utilization
        target:
          type: AverageValue
          averageValue: "75"