# ============================================================
# NexusVideo Service — ComfyUI Worker 后端服务
#
# 架构位置：网络层 — 为 Worker 提供 ClusterIP 内部访问入口
# Nginx Ingress → ClusterIP → Pod（ComfyUI API 9000 + 健康检查 8000）
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: comfyui-worker-service
  namespace: nexusvideo
  labels:
    app: comfyui-worker
spec:
  type: ClusterIP
  # 选择所有 ComfyUI Worker Pod
  selector:
    app: comfyui-worker
  ports:
    - name: api
      port: 9000
      targetPort: api
      protocol: TCP
    - name: probe
      port: 8000
      targetPort: probe
      protocol: TCP
  # 会话保持：同一 IP 的请求尽可能路由到同一 Worker
  # 避免用户多次查询进度时跳转到不同 Worker
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 300
---
# ============================================================
# NexusVideo Service — API Gateway 后端服务
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: nexusvideo
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP