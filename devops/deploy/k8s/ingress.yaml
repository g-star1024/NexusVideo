# ============================================================
# NexusVideo Ingress — 外部域名路由
#
# 架构位置：边缘入口层 — 通过域名 api.nexusvideo.com 接收外部请求
# TLS 终止在 Ingress 层，后端走明文 HTTP
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexusvideo-ingress
  namespace: nexusvideo
  annotations:
    # 阿里云 ACK Ingress Controller 配置
    kubernetes.io/ingress.class: "nginx"
    # TLS 证书 Secret（SSL 证书）
    kubernetes.io/tls-acme: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # 限流：每秒最多 100 个请求/IP
    nginx.ingress.kubernetes.io/limit-rps: "100"
    # 请求体大小限制（上传图片最大 50MB）
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # WebSocket 支持
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # gzip 压缩
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # CORS 配置
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type"
spec:
  tls:
    - hosts:
        - api.nexusvideo.com
      secretName: nexusvideo-tls
  rules:
    - host: api.nexusvideo.com
      http:
        paths:
          # API 网关路由
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: api-gateway-service
                port:
                  number: 8000
          - path: /api/v1/
            pathType: Prefix
            backend:
              service:
                name: api-gateway-service
                port:
                  number: 8000
          # WebSocket 进度推送
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: api-gateway-service
                port:
                  number: 8000
          - path: /ws/
            pathType: Prefix
            backend:
              service:
                name: api-gateway-service
                port:
                  number: 8000
          # 健康检查端点
          - path: /health
            pathType: Exact
            backend:
              service:
                name: api-gateway-service
                port:
                  number: 8000
          - path: /ready
            pathType: Exact
            backend:
              service:
                name: api-gateway-service
                port:
                  number: 8000
          # 静态文件（前端构建产物）
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexusvideo-frontend
                port:
                  number: 80