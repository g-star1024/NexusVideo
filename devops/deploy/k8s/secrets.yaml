# ============================================================
# NexusVideo 敏感信息 Secret
#
# 生产环境强烈建议使用 External Secrets Operator + 阿里云 KMS
# 或 HashiCorp Vault 管理敏感信息，不要硬编码在 Secret 中。
#
# 示例用法（生产环境请通过 External Secrets 对接 KMS）：
#
# --- external-secret.yaml (示例) ---
# apiVersion: external-secrets.io/v1beta1
# kind: ExternalSecret
# metadata:
#   name: nexusvideo-secrets
#   namespace: nexusvideo
# spec:
#   refreshInterval: 1h
#   secretStoreRef:
#     name: aliyun-kms
#     kind: ClusterSecretStore
#   target:
#     name: nexusvideo-secrets
#     creationPolicy: Owner
#   data:
#     - secretKey: DB_PASSWORD
#       remoteRef:
#         key: nexusvideo-staging-db-password
#     - secretKey: REDIS_PASSWORD
#       remoteRef:
#         key: nexusvideo-staging-redis-password
#     - secretKey: JWT_SECRET
#       remoteRef:
#         key: nexusvideo-staging-jwt-secret
#     - secretKey: OSS_ACCESS_KEY_ID
#       remoteRef:
#         key: nexusvideo-staging-oss-key-id
#     - secretKey: OSS_ACCESS_KEY_SECRET
#       remoteRef:
#         key: nexusvideo-staging-oss-key-secret
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: nexusvideo-secrets
  namespace: nexusvideo
type: Opaque
stringData:
  # 数据库密码（staging 示例，生产请通过 KMS 注入）
  DB_PASSWORD: "NexusVideo_2024_Staging_DB!"
  # Redis 密码
  REDIS_PASSWORD: "NexusVideo_2024_Staging_Redis!"
  # JWT 签名密钥（HS256，生产建议 256 位随机字符串）
  JWT_SECRET: "nexusvideo-staging-jwt-signing-key-2024"
  # 阿里云 OSS 凭证（用于 ComfyUI Worker 上传输出文件）
  OSS_ACCESS_KEY_ID: "LTAI5tSTAGINGEXAMPLE"
  OSS_ACCESS_KEY_SECRET: "STAGING-OSS-SECRET-EXAMPLE"