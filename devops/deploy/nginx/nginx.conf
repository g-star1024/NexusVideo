# ============================================================
# NexusVideo Nginx 反向代理配置
#
# 架构位置：边缘层 — 承接 SLB 443 后的所有外部流量
# 负责路由分发、限流、缓存、Gzip 压缩、SSL 终端
#
# 部署方式：
#   - 方案 A：挂载到 K8s Ingress Controller 的 ConfigMap
#   - 方案 B：独立 Nginx Pod 部署（用于开发/staging 环境）
# ============================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ================================================================
    # 日志格式
    # ================================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log main buffer=32k flush=5s;

    # ================================================================
    # 基础性能优化
    # ================================================================
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    client_max_body_size 50m;  # 允许上传 50MB 的首帧图片

    # ================================================================
    # Gzip 压缩
    # ================================================================
    gzip  on;
    gzip_vary on;
    gzip_proxied any;
    gzip_compiling on;
    gzip_min_length 256;
    gzip_levels 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/x-font-ttf
        application/vnd.ms-fontobject
        font/opentype;

    # ================================================================
    # 限流配置（防 DDoS）
    # ================================================================
    # IP 级别：每秒最多 100 个请求，突发 200
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    # API 端点更严格限流：每秒 30 请求
    limit_req_zone $binary_remote_addr zone=api_strict:10m rate=30r/s;
    # WebSocket 连接限制
    limit_conn_zone $binary_remote_addr zone=ws_limit:10m;
    limit_conn ws_limit 50;

    # 连接速率限制
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_conn conn_limit 20;

    # 限流错误页
    limit_req_status 429;
    limit_conn_status 429;

    # ================================================================
    # 上游后端服务定义
    # ================================================================
    upstream api_gateway {
        # K8s Service 的 ClusterIP（由 DNS 解析）
        server api-gateway-service.nexusvideo.svc.cluster.local:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream comfyui_worker {
        server comfyui-worker-service.nexusvideo.svc.cluster.local:9000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    upstream frontend_static {
        server frontend-service.nexusvideo.svc.cluster.local:80 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # ================================================================
    # 安全头
    # ================================================================
    map $sent_http_content_type $referrer_policy {
        ~image/    "no-referrer";
        default    "strict-origin-when-cross-origin";
    }

    # ================================================================
    # Server: HTTPS（443）
    # ================================================================
    server {
        listen       443 ssl http2;
        server_name  api.nexusvideo.com app.nexusvideo.com;

        # SSL 证书（Let's Encrypt / 阿里云 CA）
        ssl_certificate     /etc/nginx/ssl/api.nexusvideo.com.pem;
        ssl_certificate_key /etc/nginx/ssl/api.nexusvideo.com.key;

        # SSL 优化
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy $referrer_policy always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss://api.nexusvideo.com ws://api.nexusvideo.com;" always;

        # 隐藏 Nginx 版本
        server_tokens off;

        # ---- 健康检查端点（无需鉴权，供 SLB / K8s 探针使用）----
        location = /health {
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        location = /ready {
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        # ---- API 网关路由（严格限流）----
        location /api/v1/ {
            limit_req zone=api_strict burst=60 nodelay;
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # 上传文件超时（图生视频可能需要上传大图）
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_connect_timeout 10s;

            # 缓存控制：API 响应不缓存
            proxy_cache off;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        # ---- WebSocket 进度推送 ----
        location /ws/ {
            limit_conn conn_limit 20;
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # WebSocket 长连接超时
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # 不缓存 WebSocket
            proxy_buffering off;
            proxy_cache off;
        }

        # ---- 静态资源（前端构建产物）----
        location / {
            try_files $uri $uri/ /index.html;  # SPA 路由兜底
            root /usr/share/nginx/html;

            # 缓存策略
            location ~* \.(js|css)$ {
                expires 7d;
                add_header Cache-Control "public, immutable";
            }

            location ~* \.(html)$ {
                expires -1;
                add_header Cache-Control "no-cache";
            }

            location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 30d;
                add_header Cache-Control "public, immutable";
                access_log off;
            }

            # 静态资源限流宽松一些
            limit_req zone=api_limit burst=200 nodelay;
        }

        # ---- 静态资源 CDN 前缀 ----
        location /static/ {
            alias /usr/share/nginx/html/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ---- 404 错误页 ----
        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }

        # ---- 50x 错误页 ----
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # ================================================================
    # Server: HTTP（80）→ 重定向到 HTTPS
    # ================================================================
    server {
        listen       80;
        server_name  api.nexusvideo.com app.nexusvideo.com;

        # HTTP → HTTPS 重定向
        return 301 https://$host$request_uri;
    }
}