version: "3.9"

# ============================================================
# NexusVideo 单机开发/预发布 Docker Compose
# 包含：Redis + FastAPI + ComfyUI Worker + Nginx + Prometheus + Grafana
#
# 使用方法：
#   docker compose up -d
#   docker compose logs -f
# ============================================================

# ---- 共享存储卷（开发环境替代 NAS） ----
volumes:
  models:
    name: nexusvideo-models
  redis_data:
    name: nexusvideo-redis-data
  prometheus_data:
    name: nexusvideo-prometheus-data
  grafana_data:
    name: nexusvideo-grafana-data

# ---- 网络 ----
networks:
  nexusvideo-net:
    driver: bridge

# ============================================================
services:

  # ------------------------------------------------------------
  # Redis：任务队列（Celery Broker）+ 会话缓存
  # ------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nexusvideo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-nexusvideo_redis}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    networks:
      - nexusvideo-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-nexusvideo_redis}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ------------------------------------------------------------
  # FastAPI 后端（API 网关 + 任务调度）
  # ------------------------------------------------------------
  fastapi:
    build:
      context: ./fastapi-backend
      dockerfile: Dockerfile
    image: nexusvideo/fastapi-backend:latest
    container_name: nexusvideo-fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://${REDIS_PASSWORD:-nexusvideo_redis}@redis:6379/0
      DB_URL: sqlite:///./nexusvideo.db
      NAS_MOUNT_PATH: /models
      COMFYUI_URL: http://comfyui-worker:9000
      OSS_BUCKET: nexusvideo-staging-outputs
      JWT_SECRET: ${JWT_SECRET:-nexusvideo-dev-jwt-secret}
      JWT_ALGORITHM: HS256
      TOKEN_EXPIRY_HOURS: 168
    volumes:
      - models:/models
    networks:
      - nexusvideo-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ------------------------------------------------------------
  # ComfyUI Worker（GPU 推理）
  # ------------------------------------------------------------
  comfyui-worker:
    build:
      context: ./comfyui-worker
      dockerfile: Dockerfile
    image: nexusvideo/comfyui-worker:latest
    container_name: nexusvideo-comfyui-worker
    restart: unless-stopped
    ports:
      - "9000:9000"    # ComfyUI API
      - "8001:8000"    # 健康检查端点（对外映射 8001，避免与 FastAPI 8000 冲突）
    environment:
      NAS_MOUNT_PATH: /models
      SPOT_MODE: "false"
    volumes:
      - models:/models    # 模型共享卷
    # GPU 支持（需要 host 已安装 NVIDIA Container Toolkit）
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - nexusvideo-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

  # ------------------------------------------------------------
  # Nginx（反向代理 + 静态资源）
  # ------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: nexusvideo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - nexusvideo-net
    depends_on:
      - fastapi
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ------------------------------------------------------------
  # Prometheus（指标采集）
  # ------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.47.2
    container_name: nexusvideo-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command: >
      --config.file=/etc/prometheus/prometheus.yml
      --storage.tsdb.path=/prometheus
      --storage.tsdb.retention.time=7d
      --web.enable-lifecycle
    networks:
      - nexusvideo-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ------------------------------------------------------------
  # Grafana（监控看板）
  # ------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.2.3
    container_name: nexusvideo-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/nexusvideo-dashboard.json:ro
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    networks:
      - nexusvideo-net
    depends_on:
      - prometheus