# Nginx 主配置文件 — NexusVideo 生产环境
# 挂载路径：deploy/nginx/nginx.conf → /etc/nginx/nginx.conf
#
# 路由规则：
#   /api/*           → FastAPI (8000)     反向代理，含限流
#   /progress/ws     → FastAPI (8000)     WebSocket 升级
#   /static/*        → 本地静态资源         前端产物
#   /metrics         → Prometheus (9090)  内网访问
#   /health          → Nginx 自建         健康检查端点

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ---- 日志格式 ----
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ---- 限流区域 ----
    # API 限流：每 IP 平均 30 req/min，突发上限 10
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    # WebSocket 限流：每 IP 平均 5 conn/min
    limit_req_zone $binary_remote_addr zone=ws:10m rate=5r/m;

    # ---- 客户端限制 ----
    client_max_body_size 500M;   # 视频上传大小上限
    client_body_timeout  60s;
    client_header_timeout 30s;

    # ---- 上游服务定义 ----
    upstream fastapi {
        server fastapi:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream prometheus {
        server prometheus:9090;
    }

    # ============================================================
    # HTTP → HTTPS 重定向
    # ============================================================
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ============================================================
    # HTTPS 主 Server
    # ============================================================
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL 证书（通过 volume 挂载）
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # ---- 安全响应头 ----
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ---- 1. FastAPI API 路由 ----
        location /api/ {
            limit_req zone=api burst=10 nodelay;

            proxy_pass http://fastapi;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # 超时
            proxy_connect_timeout 10s;
            proxy_read_timeout  300s;   # 视频生成可能耗时较长
            proxy_send_timeout  300s;

            # 缓冲
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # ---- 2. WebSocket 进度推送 ----
        location /progress/ws {
            limit_req zone=ws burst=5 nodelay;

            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;   # 24h 长连接
        }

        # ---- 3. 静态资源 ----
        location /static/ {
            alias /usr/share/nginx/html/;
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ---- 4. 健康检查 ----
        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx","time":"$time_iso8601"}';
            add_header Content-Type application/json;
        }

        # ---- 5. Prometheus 指标（内网访问） ----
        location /metrics {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            deny all;

            proxy_pass http://prometheus/metrics;
        }

        # ---- 6. Grafana 代理 ----
        location /monitor/ {
            proxy_pass http://grafana:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}